<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow - Premium Events</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-ticket-simple fa-rotate-by"
                    style="color: var(--secondary-color); --fa-rotate-angle: -20deg;"></i>
                <span class="brand-gradient ms-2">TicketFlow</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <button id="btn-meus-ingressos" class="btn btn-sm btn-outline-info rounded-pill px-3"
                    style="display: none;" onclick="verMeusIngressos()">
                    <i class="fa-solid fa-ticket"></i> Meus Ingressos
                </button>

                <div id="user-info" class="me-3 text-muted small ms-2" style="display: none;">
                    <i class="fa-regular fa-user"></i> <span id="username-display">Logado</span>
                </div>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm rounded-pill px-3 ms-2"
                    style="display: none;" onclick="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container">

        <section id="tela-login" class="login-container">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card card-login">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-lock fa-3x" style="color: var(--primary-color)"></i>
                        <h3 class="mt-3 fw-bold">Acesso Restrito</h3>
                        <p class="text-muted small">Entre para ver os melhores eventos</p>
                    </div>

                    <div id="alert-erro" class="alert alert-danger d-flex align-items-center d-none" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>
                        <div id="msg-erro-txt"></div>
                    </div>

                    <a href="http://localhost:8080/oauth2/authorization/google"
                        class="btn btn-light w-100 rounded-pill border d-flex align-items-center justify-content-center mb-3 fw-bold"
                        style="color: #444;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"
                            style="width: 20px; margin-right: 10px;">
                        Entrar com Google
                    </a>

                    <div class="text-center mb-3 text-muted small">——— OU ———</div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com"
                            value="teste@seguro.com">
                        <label for="email">Email</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="senha" placeholder="Password" value="123">
                        <label for="senha">Senha</label>
                    </div>

                    <button onclick="fazerLogin()" id="btn-login" class="btn btn-gradiente w-100 rounded-pill">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> ENTRAR
                    </button>
                </div>
            </div>
        </section>

        <section id="tela-eventos">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="fw-bold mb-0"><span class="text-primary">Próximos</span> Eventos 🎸</h2>
                <span class="badge bg-secondary rounded-pill px-3 py-2">
                    <i class="fa-solid fa-calendar-days me-1"></i> Agenda 2025
                </span>
            </div>

            <div id="loading-spinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                <p class="mt-3 text-muted">Buscando os melhores shows...</p>
            </div>

            <div id="lista-eventos" class="row g-4"></div>
        </section>

        <div class="modal fade" id="modalCompra" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content"
                    style="background-color: var(--card-bg); color: white; border: 1px solid rgba(255,255,255,0.1);">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">🎟️ Finalizar Compra</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="form-compra">
                            <div class="mb-3">
                                <label class="form-label text-muted small">TIPO DE INGRESSO</label>
                                <select class="form-select bg-dark text-white border-secondary" id="select-ingresso">
                                    <option selected disabled>Carregando...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small">QUANTIDADE</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary"
                                    id="qtd-ingresso" value="1" min="1" max="10">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-light btn-sm"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-gradiente rounded-pill px-4" onclick="confirmarCompra()">
                            <i class="fa-solid fa-check"></i> Confirmar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalMeusIngressos" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content"
                    style="background-color: #16213e; color: white; border: 1px solid var(--primary-color);">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title fw-bold"><i class="fa-solid fa-wallet text-primary"></i> Minha Carteira
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="lista-meus-ingressos">
                        <div class="text-center py-4 text-muted">Carregando...</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
